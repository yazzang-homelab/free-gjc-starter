# free-gjc-starter — beginner FREE profile for gajae-code (gjc).
#
# 메인 루프(default) = 당신의 Gemini(구독 또는 무료), OAuth 로그인으로 사용 → 파일에 키 없음.
# 서브에이전트(executor/architect/planner/critic) = "당신 본인"이 발급받은 무료 키로 쓰는 무료 모델.
#
# ★ 이 파일에는 비밀정보가 하나도 없다. 모든 키는 환경변수 "이름"(apiKeyEnv)으로만 참조한다.
#   진짜 키는 각자 자기 셸 환경변수에 넣는다 (README 참고). 절대 이 파일에 리터럴로 박지 마라.

providers:
  # --- 무료 서브에이전트 #1: OpenRouter (:free 모델) ---
  # 무료 키 발급: https://openrouter.ai/keys   →   export OPENROUTER_API_KEY=...
  openrouter-free:
    baseUrl: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    api: openai-completions
    headers:
      HTTP-Referer: https://github.com/yazzang-homelab/free-gjc-starter
      X-Title: free-gjc
    models:
      - id: nvidia/nemotron-3-super-120b-a12b:free
        name: 【무료】 Nemotron 3 Super 120B · OpenRouter
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

  # --- 무료 서브에이전트 #2: Groq (매우 빠름) ---
  # 무료 키 발급: https://console.groq.com/keys   →   export GROQ_API_KEY=...
  # ※ 옛 llama-3.3-70b-versatile / llama-3.1-8b-instant 는 2026-08-16 무료·개발자 티어에서 종료됨(Groq 공식 deprecation).
  #   Groq 권장 대체 = openai/gpt-oss-120b, openai/gpt-oss-20b (무료 한도: 30 RPM / 1K RPD / 8K TPM).
  groq-free:
    baseUrl: https://api.groq.com/openai/v1
    apiKeyEnv: GROQ_API_KEY
    api: openai-completions
    models:
      - id: openai/gpt-oss-120b
        name: 【무료】 GPT-OSS 120B · Groq
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      - id: openai/gpt-oss-20b
        name: 【무료】 GPT-OSS 20B · Groq
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 16000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

  # --- 무료 메인 대안(2nd): NVIDIA NIM · GLM-5.3 ---
  # Gemini를 아예 안 쓰는 사람용 메인 모델 후보 + Gemini 장애 시 default 폴백.
  # ※ 옛 z-ai/glm-5.2 는 NVIDIA가 2026-08-20 API 종료(deprecated) → /v1/models 목록에서 사라짐. 후속 GLM-5.3(753B)으로 교체.
  # 무료 키 발급: https://build.nvidia.com/z-ai/glm-5-3  →  export NVIDIA_API_KEY=...
  nvidia-nim:
    baseUrl: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NVIDIA_API_KEY
    api: openai-completions
    models:
      - id: z-ai/glm-5.3
        name: 【무료】 GLM-5.3 (753B) · NVIDIA NIM
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

  # 메인 루프(default)는 gjc 내장 google provider를 OAuth 로그인으로 쓴다 → 여기 항목 불필요.
  #   무료: /login google-antigravity  (개인 Gmail, 카드 X). default는 이미 google-antigravity/gemini-3.1-pro-low:high.
  #   ※ 무료티어는 Gemini 3.1 Pro만. Opus 등 Claude는 유료 → 무료계정이 고르면 404.
  #   ※ 옛 /login google-gemini-cli 무료(Code Assist for individuals)는 2026-06-18 종료.
